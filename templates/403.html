<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access denied - TOSCA API</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .card {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 500px;
      }
      .code {
        font-size: 48px;
        font-weight: 700;
        color: #764ba2;
        margin: 0;
      }
      h1 {
        margin: 8px 0 16px;
        color: #333;
      }
      p {
        color: #666;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        padding: 12px 30px;
        margin: 16px 8px 0;
        background: #667eea;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: 600;
        transition: background 0.3s;
      }
      .btn:hover {
        background: #5568d3;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="code">403</p>
      <h1>You don't have access to this area</h1>
      <p>
        Your account is signed in but doesn't have the permissions required for
        this page. If you think this is a mistake, please contact your system
        administrator.
      </p>
      <a href="/welcome/" class="btn">Go to your account</a>
    </div>
  </body>
</html>
