<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-in failed - TOSCA API</title>
    <!--
      Overrides allauth's default socialaccount/authentication_error.html so a
      failed Keycloak/OAuth handshake shows a branded page instead of the bare
      library default.
    -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .card {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 500px;
      }
      h1 {
        margin: 0 0 16px;
        color: #333;
      }
      p {
        color: #666;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        padding: 12px 30px;
        margin: 16px 8px 0;
        background: #667eea;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: 600;
        transition: background 0.3s;
      }
      .btn:hover {
        background: #5568d3;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>We couldn't sign you in</h1>
      <p>
        Something went wrong while completing your login. This is usually
        temporary. Please try again, and contact your system administrator if
        the problem continues.
      </p>
      <a href="/accounts/login/" class="btn">Try again</a>
    </div>
  </body>
</html>
