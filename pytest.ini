[pytest]
DJANGO_SETTINGS_MODULE = tosca_api.settings.test
python_files = tests.py test_*.py *_tests.py
addopts = --reuse-db
# The geoserver-rest submodule ships its own test suite with third-party deps
# (seaborn, environs) that are not part of this project. Skip its tree.
norecursedirs = tosca_api/apps/geodata_providers/geoserver/geoserver-rest .claude

