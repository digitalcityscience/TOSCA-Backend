name: CI

# Lint, tests, image build and an image smoke test on every pull request and
# on main. Nothing is pushed to GHCR from here: images are published only by
# release.yml, from a release tag.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: tosca-backend:ci

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (commits of this change)
        run: |
          range=${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD~1..HEAD' }}
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --redact --no-banner --log-opts="$range"

  build-and-test:
    name: Build, lint, test, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/django/Dockerfile.prod
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}

      # Blocking for the Python files this change adds or modifies.
      - name: Ruff (changed files)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=AMR \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            -- '*.py' | grep -v '^vendor/' || true)
          if [[ -z $files ]]; then echo "No Python files changed."; exit 0; fi
          RUFF_PATHS=$(tr '\n' ' ' <<<"$files") scripts/ci/run.sh lint "$IMAGE"

      # Report only: the tree still has older findings. Make it blocking once
      # `ruff check tosca_api` is clean.
      - name: Ruff (whole tree, report only)
        continue-on-error: true
        run: scripts/ci/run.sh lint "$IMAGE"

      - name: pytest (all but live-GeoServer integration tests)
        run: scripts/ci/run.sh test "$IMAGE"

      - name: Smoke test the image in production mode
        run: scripts/ci/run.sh smoke "$IMAGE"
