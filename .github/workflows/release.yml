name: Release

# Publishes ghcr.io/digitalcityscience/tosca-backend from a release tag.
#
#   tag v1.2.3  ->  image tosca-backend:1.2.3 + GitHub Release
#   tag v1.3.0-rc.1  ->  image tosca-backend:1.3.0-rc.1 + GitHub pre-release
#
# A version is published once: if the image tag already exists in GHCR the run
# stops, so a published image is never replaced. No `latest` or `main` tags.
#
# Order: check the tag -> build every platform once into an OCI archive ->
# lint, test and smoke test the amd64 image from that archive -> push exactly
# that archive -> create the GitHub Release. Nothing is deployed anywhere.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v1.0.0 (only if the tag push run failed before publishing)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/digitalcityscience/tosca-backend
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          submodules: recursive
          fetch-depth: 0

      - name: Check the tag
        id: tag
        run: |
          set -euo pipefail
          [[ $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]] \
            || { echo "::error::Tag '$TAG' is not a release tag (vX.Y.Z or vX.Y.Z-rc.N)"; exit 1; }
          version=${TAG#v}
          project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          [[ ${version%%-rc.*} == "$project" ]] \
            || { echo "::error::Tag $TAG does not match version \"$project\" in pyproject.toml"; exit 1; }
          git fetch -q origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main \
            || { echo "::error::$TAG does not point at a commit on main"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            [[ $version == *-rc.* ]] && echo "prerelease=--prerelease" || echo "prerelease="
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to replace a published image
        run: |
          # Fails closed: only "manifest unknown" counts as "not published yet".
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq skopeo; }
          ref="docker://$IMAGE:${{ steps.tag.outputs.version }}"
          if out=$(skopeo inspect --raw --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" "$ref" 2>&1); then
            echo "::error::$IMAGE:${{ steps.tag.outputs.version }} already exists. Release a new version instead."
            exit 1
          elif ! grep -qi 'manifest unknown' <<<"$out"; then
            echo "::error::Could not check whether $ref exists: $out"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build all platforms into an OCI archive
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/django/Dockerfile.prod
          platforms: ${{ env.PLATFORMS }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          provenance: false
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
            REVISION=${{ steps.tag.outputs.revision }}

      - name: Load the amd64 image from the archive
        run: |
          skopeo copy -q --override-arch amd64 --override-os linux \
            "oci-archive:${{ runner.temp }}/image.tar" docker-daemon:tosca-backend:release-test

      - name: Ruff (report only)
        continue-on-error: true
        run: scripts/ci/run.sh lint tosca-backend:release-test

      - name: pytest
        run: scripts/ci/run.sh test tosca-backend:release-test

      - name: Smoke test
        run: scripts/ci/run.sh smoke tosca-backend:release-test

      - name: Push the tested archive to GHCR
        id: push
        run: |
          set -euo pipefail
          skopeo copy -q --all --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "oci-archive:${{ runner.temp }}/image.tar" "docker://$IMAGE:${{ steps.tag.outputs.version }}"
          digest=$(skopeo inspect --raw --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker://$IMAGE:${{ steps.tag.outputs.version }}" | sha256sum | cut -d' ' -f1)
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md
            echo
            echo "### Image"
            echo
            echo '```'
            echo "$IMAGE:$VERSION@$DIGEST"
            echo '```'
            echo
            echo "Platforms: $PLATFORMS. Tested before publishing: pytest against PostGIS and Garage, and a production-mode smoke test of this exact image (amd64)."
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } > "${{ runner.temp }}/notes.md"
          # shellcheck disable=SC2086 # prerelease is empty or one flag
          gh release create "$TAG" --verify-tag --title "tosca-backend $VERSION" \
            --notes-file "${{ runner.temp }}/notes.md" ${{ steps.tag.outputs.prerelease }}

      - name: Summary
        run: |
          echo "Published \`$IMAGE:${{ steps.tag.outputs.version }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
