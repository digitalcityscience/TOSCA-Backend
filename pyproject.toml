[project]
name = "tosca_api"
version = "0.1.0"
description = "TOSCA-Web API - Backend for geospatial web applications"
requires-python = ">=3.14"
readme = "README.md"
authors = [
    { name = "TOSCA Team", email = "team@example.com" }
]
license = "MIT"
dependencies = [
    "django>=5.2.16,<5.3",
    "djangorestframework>=3.15.0",
    "django-environ>=0.11.0",
    "python-keycloak>=4.0.0",
    "pyjwt[crypto]>=2.8.0",
    "psycopg[binary]>=3.2.0",
    "django-allauth==65.14.1",
    "dj-rest-auth>=7.0.1",
    "ruff>=0.14.7",
    "python-json-logger>=4.0.0",
    "nh3>=0.3.2",
    "drf-spectacular>=0.29.0",
    "djangorestframework-gis>=1.2.0",
    "django-basic-form-builder>=0.1.5",
    "xmltodict>=1.0.2",
    "django-cryptography>=1.1",
    "cryptography>=46.0.3",
    "pillow>=10.0.0",
    "requests>=2.32.0",
    "sqlalchemy>=2.0",
    "geoserver-rest",
    "whitenoise>=6.7.0",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.8.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tosca_api.settings.test"
python_files = "tests.py test_*.py *_tests.py"
markers = [
    "integration: tests that require live external services such as GeoServer",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# The geoserver-rest submodule lives under vendor/ specifically so it's
# outside tosca_api/ and doesn't need excluding here — but exclude it
# explicitly too in case ruff is ever pointed at the repo root.
exclude = ["vendor"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = [
    "tosca_api/apps/geodata_providers/geoserver/geoserver-rest/",
    "migrations/",
]
# Minimal, permissive baseline: runs non-blocking in CI (see
# .github/workflows/ci.yml) until the codebase has real type coverage to
# tighten against. Do not add strict flags here until that's true.

[tool.setuptools.packages.find]
include = ["tosca_api*"]
exclude = ["docker*"]


[tool.uv]
python-preference = "managed"

[tool.uv.sources]
geoserver-rest = { path = "vendor/geoserver-rest", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.11.1",
    "ruff>=0.14.7",
    "pre-commit>=4.0.0",
]
